[workspace]
resolver = "2"
members = ["crates/generator", "crates/vault-core", "crates/health", "crates/cli"]
# App Tauri build riêng (cần frontend đã build) — xem app/README.
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Argon2 256 MiB rất chậm khi không tối ưu — tối ưu thư viện phụ thuộc cả ở bản debug.
[profile.dev.package."*"]
opt-level = 3
