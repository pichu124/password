[package]
name = "pwv-app"
description = "pwv — Kho mật khẩu (giao diện Windows)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "pwv_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
arboard = { version = "3", default-features = false }
pwv-generator = { path = "../../crates/generator" }
pwv-vault-core = { path = "../../crates/vault-core" }
pwv-health = { path = "../../crates/health" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

# Argon2 256 MiB rất chậm khi không tối ưu — tối ưu thư viện phụ thuộc cả ở bản debug.
[profile.dev.package."*"]
opt-level = 3
