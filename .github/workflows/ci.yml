name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p pwv-cli

      - name: Cross-check format with independent Python decryptor
        shell: bash
        run: |
          pip install pynacl argon2-cffi
          cargo run -q -p pwv-vault-core --example make_fixture -- fixture.pwv "pässwörd"
          python -I -c "
          import sys; sys.path.insert(0, 'tools')
          from pwv_recover import decrypt_vault
          d = decrypt_vault(open('fixture.pwv','rb').read(), 'pässwörd'.encode())
          e = d['entries'][0]
          assert e['title'] == 'Ngân hàng Việt', e
          assert e['password'] == 'đổi lần 2', e
          assert e['password_history'][0]['password'] == 'Mật-khẩu-có-dấu-🔐', e
          print('cross-check OK')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: pwv-windows
          path: target/release/pwv.exe

  app-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Rust fmt / clippy / test (app)
        working-directory: app/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build installer (NSIS + MSI)
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: pwv-app-windows-installer
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Chỉ lỗi khi có lỗ hổng thật; cảnh báo "unmaintained" vẫn được in ra nhưng không làm đỏ CI.
      - name: cargo audit
        run: cargo audit
