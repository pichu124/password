# Build app Android (APK, chỉ xem + sao chép).
# - Khi push: tạo bản build thử `dev-build-…` (KHÔNG dùng để cài).
# - Được workflow Release gọi lại để tạo APK của bản phát hành.
name: Android

on:
  push:
    paths:
      - "app/**"
      - "crates/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: dev-build-pwv-android-apk
      # Chỉ workflow Release đặt true: ký bằng khoá cố định trong Secrets. Mọi bản build thử (push)
      # luôn ký bằng khoá tạm, nên không bao giờ cài đè được lên app chính thức.
      release-signing:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  # Job BUILD chạy mã của bên thứ ba (npm, Gradle, cargo) nên KHÔNG được thấy khoá ký.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Generate Android project
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri icon assets/icon.png

      # Dự án Android được sinh lại ở mỗi lần build nên các thiết lập bảo mật được vá vào đây,
      # và build sẽ ĐỎ nếu vá không thành (mẫu của Tauri thay đổi).
      - name: Harden generated Android project
        working-directory: app/src-tauri
        run: |
          set -euo pipefail
          GEN=gen/android/app/src/main
          MAIN=$(find "$GEN/java" -name MainActivity.kt)
          test -n "$MAIN"
          PKG=$(grep -m1 '^package ' "$MAIN")
          { echo "$PKG"; echo; cat android-overrides/MainActivity.kt; } > "$MAIN.new"
          mv "$MAIN.new" "$MAIN"
          grep -q 'FLAG_SECURE' "$MAIN"
          grep -q 'IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS' "$MAIN"
          # Bộ chọn file kho giữ quyền đọc lâu dài: cùng gói với MainActivity; lib.rs nạp nó theo tên
          # gói vn.pwv.vault, nên gói khác tên là build đỏ (chứ không phải app lặng lẽ mất tính năng).
          test "$PKG" = "package vn.pwv.vault"
          PICKER="$(dirname "$MAIN")/VaultPickerPlugin.kt"
          { echo "$PKG"; echo; cat android-overrides/VaultPickerPlugin.kt; } > "$PICKER"
          grep -q 'takePersistableUriPermission' "$PICKER"
          grep -q 'ACTION_OPEN_DOCUMENT' "$PICKER"

          mkdir -p "$GEN/res/xml"
          cp android-overrides/data_extraction_rules.xml "$GEN/res/xml/"
          MAN="$GEN/AndroidManifest.xml"
          sed -i '0,/<application/s|<application|<application\n        android:allowBackup="false"\n        android:fullBackupContent="false"\n        android:dataExtractionRules="@xml/data_extraction_rules"|' "$MAN"
          grep -q 'android:allowBackup="false"' "$MAN"
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' "$MAN"
          echo "----- MainActivity.kt"; cat "$MAIN"
          echo "----- VaultPickerPlugin.kt"; cat "$PICKER"
          echo "----- AndroidManifest.xml"; cat "$MAN"

      - name: Build APK (arm64)
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 -- --locked

      - name: Collect unsigned APK
        run: |
          set -euo pipefail
          APK=$(find app/src-tauri/gen/android -name "*-unsigned.apk" | head -1)
          test -n "$APK"
          echo "APK chưa ký: $APK"
          cp "$APK" pwv-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'dev-build-pwv-android-apk' }}-unsigned
          path: pwv-unsigned.apk
          retention-days: 1

  # Job KÝ chỉ tải file APK về và chạy công cụ của Android SDK có sẵn trên máy chạy: không checkout
  # mã nguồn, không chạy npm/Gradle/cargo ⇒ một thư viện bị cài mã độc lúc build không chạm được khoá ký.
  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'dev-build-pwv-android-apk' }}-unsigned

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ inputs.release-signing && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ inputs.release-signing && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
        run: |
          set -euo pipefail
          APK=pwv-unsigned.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"
            SIGNER="khoá cố định của kho mã — các bản phát hành sau (cùng khoá này) cài đè lên được. Nếu app pwv đang cài trên điện thoại được ký bằng khoá khác (bản 0.1.x, hoặc một bản build thử) thì phải gỡ app cũ MỘT lần trước khi cài bản này; kho trên Drive/Dropbox không bị ảnh hưởng."
          else
            # Không dùng khoá cố định (bản build thử, hoặc chưa có khoá trong Secrets) ⇒ tạo khoá tạm
            # cho lần build này. Hệ quả: muốn cài bản mới phải gỡ bản cũ trước (kho trên Drive/Dropbox
            # không bị ảnh hưởng).
            PASS="pwv-temp-$(openssl rand -hex 12)"
            keytool -genkeypair -keystore release.jks -storepass "$PASS" -keypass "$PASS" \
              -alias pwv -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=pwv"
            SIGNER="KHOÁ TẠM của riêng lần build này (phải gỡ bản cũ trước khi cài)"
            echo "::warning::Đang ký APK bằng khoá tạm. Bản phát hành cần secret ANDROID_KEYSTORE_BASE64 để cập nhật được mà không phải gỡ app."
          fi
          "$BT/zipalign" -f -p 4 "$APK" pwv-aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias pwv \
            --out pwv-android-arm64.apk pwv-aligned.apk
          rm -f release.jks
          "$BT/apksigner" verify --print-certs pwv-android-arm64.apk | tee certs.txt
          # Kiểm tra trên CHÍNH file APK: không cho sao lưu / chuyển dữ liệu app sang máy khác.
          # (So đúng GIÁ TRỊ của thuộc tính — mã định danh của thuộc tính cũng chứa chuỗi "0x0".)
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml pwv-android-arm64.apk > manifest.txt
          grep -E 'allowBackup|fullBackupContent|dataExtractionRules' manifest.txt || true
          grep -Eq 'allowBackup\(0x[0-9a-f]+\)=(false|\(type 0x12\)0x0)$' manifest.txt
          grep -Eq 'fullBackupContent\(0x[0-9a-f]+\)=(false|\(type 0x12\)0x0)$' manifest.txt
          grep -Eq 'dataExtractionRules\(0x[0-9a-f]+\)=@' manifest.txt
          {
            echo "Ký bằng: $SIGNER"
            grep -i 'SHA-256' certs.txt | head -1
          } > pwv-android-signer.txt
          cat pwv-android-signer.txt
          ls -la pwv-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'dev-build-pwv-android-apk' }}
          path: |
            pwv-android-arm64.apk
            pwv-android-signer.txt
          retention-days: 5
