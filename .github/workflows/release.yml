# Phát hành bản mới lên GitHub Releases. Chạy bằng tay:
# tab Actions → "Release" → Run workflow.
# Trước đó tăng phiên bản: python tools/set_version.py 0.2.0 (rồi commit + push).
#
# Các job BUILD chỉ có quyền đọc; chỉ job cuối (publish) có quyền ghi và nó không chạy mã của bên
# thứ ba nào — một thư viện hay action bị cài mã độc trong lúc build không lấy được quyền ghi vào repo.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Only from the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Chỉ phát hành từ nhánh mặc định (${{ github.event.repository.default_branch }}), không phải ${{ github.ref_name }}."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read version
        id: v
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Phát hành phiên bản $v"
      - name: Refuse to publish the same version twice
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.v.outputs.version }}" >/dev/null; then
            echo "::error::Phiên bản v${{ steps.v.outputs.version }} đã được phát hành. Hãy chạy 'python tools/set_version.py <bản mới>', commit, push rồi chạy lại."
            exit 1
          fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Không dùng cache ở bản phát hành: build sạch từ đúng các phiên bản ghi trong file khoá.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Test
        shell: bash
        run: |
          cargo test --workspace --locked
          (cd app/src-tauri && cargo test --locked)

      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build -- --locked

      - name: Build CLI
        run: cargo build --release --locked -p pwv-cli

      - name: Collect files
        shell: bash
        run: |
          mkdir dist-release
          cp app/src-tauri/target/release/bundle/nsis/*.exe dist-release/
          cp app/src-tauri/target/release/bundle/msi/*.msi dist-release/
          cp target/release/pwv.exe dist-release/pwv-cli.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-release/*
          retention-days: 5

  android:
    needs: check
    uses: ./.github/workflows/android.yml
    with:
      artifact-name: release-android
    secrets: inherit

  publish:
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Checksums and notes
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir out
          cp dl/release-windows/* out/
          cp dl/release-android/pwv-android-arm64.apk "out/pwv_${V}_android-arm64.apk"
          SIGNER=$(cat dl/release-android/pwv-android-signer.txt)
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cat > notes.md <<NOTES
          ## Cài đặt / cập nhật trên Windows
          1. Tải \`pwv_${V}_x64-setup.exe\` bên dưới.
          2. Đóng app pwv đang mở, chạy bộ cài (cài đè lên bản cũ, không cần gỡ). Kho mật khẩu không bị ảnh hưởng.
          3. Windows cảnh báo SmartScreen (bộ cài chưa ký số) → **More info → Run anyway**. Chỉ làm vậy với file tải từ đúng trang này.

          ## Điện thoại Android
          Tải \`pwv_${V}_android-arm64.apk\` rồi mở để cài.
          ${SIGNER}

          ## Lưu ý khi nâng cấp
          Hãy cập nhật **mọi thiết bị** (các máy tính và điện thoại). Từ bản 0.2.0, file kho dùng định dạng mới:
          bản app cũ hơn sẽ báo "hãy cập nhật phần mềm" thay vì mở file — không mất dữ liệu.

          ## Kiểm tra file tải về
          \`SHA256SUMS.txt\` chỉ giúp phát hiện file tải bị LỖI (so bằng PowerShell:
          \`Get-FileHash .\\pwv_${V}_x64-setup.exe\`); nó nằm cùng chỗ với file cài nên không chứng minh được nguồn gốc.
          NOTES
          sed -i 's/^          //' notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$V" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "pwv $V" \
            --notes-file notes.md \
            --generate-notes
