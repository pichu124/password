# Phát hành bản mới lên GitHub Releases. Chạy bằng tay:
# tab Actions → "Release" → Run workflow.
# Trước đó tăng phiên bản: python tools/set_version.py 0.1.2 (rồi commit + push).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        shell: bash
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Phát hành phiên bản $v"

      - name: Refuse to publish the same version twice
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.v.outputs.version }}" >/dev/null; then
            echo "::error::Phiên bản v${{ steps.v.outputs.version }} đã được phát hành. Hãy chạy 'python tools/set_version.py <bản mới>', commit, push rồi chạy lại."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Test
        shell: bash
        run: |
          cargo test --workspace
          (cd app/src-tauri && cargo test)

      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build

      - name: Build CLI
        run: cargo build --release -p pwv-cli

      - name: Collect files and checksums
        shell: bash
        run: |
          mkdir dist-release
          cp app/src-tauri/target/release/bundle/nsis/*.exe dist-release/
          cp app/src-tauri/target/release/bundle/msi/*.msi dist-release/
          cp target/release/pwv.exe dist-release/pwv-cli.exe
          cd dist-release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: pwv ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ## Cài đặt / cập nhật
            1. Tải `pwv_${{ steps.v.outputs.version }}_x64-setup.exe` bên dưới.
            2. Đóng app pwv đang mở, chạy bộ cài (cài đè lên bản cũ, không cần gỡ). Kho mật khẩu không bị ảnh hưởng.
            3. Windows cảnh báo SmartScreen → **More info → Run anyway** (bộ cài chưa ký số).

            Kiểm tra file tải về: so mã SHA-256 với `SHA256SUMS.txt`
            (PowerShell: `Get-FileHash .\pwv_${{ steps.v.outputs.version }}_x64-setup.exe`).
          files: dist-release/*
