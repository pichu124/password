# Phát hành bản mới lên GitHub Releases. Chạy bằng tay:
# tab Actions → "Release" → Run workflow.
# Trước đó tăng phiên bản: python tools/set_version.py 0.2.0 (rồi commit + push).
#
# Các job BUILD chỉ có quyền đọc; chỉ job cuối (publish) có quyền ghi và nó không chạy mã của bên
# thứ ba nào — một thư viện hay action bị cài mã độc trong lúc build không lấy được quyền ghi vào repo.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Only from the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Chỉ phát hành từ nhánh mặc định (${{ github.event.repository.default_branch }}), không phải ${{ github.ref_name }}."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read version
        id: v
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Phát hành phiên bản $v"
      # Kiểm tra lỗ hổng thư viện, kiểm tra chéo bằng công cụ Python, clippy… chỉ chạy trong CI.
      # Không phát hành một commit mà CI chưa chạy xong hoặc đang đỏ.
      - name: CI must be green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')
          echo "Số lần CI xanh cho commit $GITHUB_SHA: $n"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::CI chưa xanh cho commit này. Hãy đợi workflow CI chạy xong (và xanh) rồi chạy lại Release."
            exit 1
          fi
      - name: Refuse to publish the same version twice
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.v.outputs.version }}" >/dev/null; then
            echo "::error::Phiên bản v${{ steps.v.outputs.version }} đã được phát hành. Hãy chạy 'python tools/set_version.py <bản mới>', commit, push rồi chạy lại."
            exit 1
          fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Không dùng cache ở bản phát hành: build sạch từ đúng các phiên bản ghi trong file khoá.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Test
        shell: bash
        run: |
          cargo test --workspace --locked
          (cd app/src-tauri && cargo test --locked)

      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build -- --locked

      - name: Build CLI
        run: cargo build --release --locked -p pwv-cli

      - name: Collect files
        shell: bash
        run: |
          mkdir dist-release
          cp app/src-tauri/target/release/bundle/nsis/*.exe dist-release/
          cp app/src-tauri/target/release/bundle/msi/*.msi dist-release/
          cp target/release/pwv.exe dist-release/pwv.exe
          # Công cụ cứu hộ không cần app (README "Cứu hộ dữ liệu không cần app"). Lấy đúng nội dung đã
          # commit (git show không đổi kiểu xuống dòng như bản checkout trên Windows có thể làm), để
          # SHA256SUMS.txt khớp với file trong repo.
          git show "HEAD:tools/pwv_recover.py" > dist-release/pwv_recover.py
          python -I -m py_compile dist-release/pwv_recover.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-release/*
          retention-days: 5

  android:
    needs: check
    uses: ./.github/workflows/android.yml
    with:
      artifact-name: release-android
      release-signing: true
    # Chỉ chuyển đúng hai secret của khoá ký (không "inherit" toàn bộ).
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  publish:
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Checksums and notes
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir out
          cp dl/release-windows/* out/
          cp dl/release-android/pwv-android-arm64.apk "out/pwv_${V}_android-arm64.apk"
          SIGNER=$(cat dl/release-android/pwv-android-signer.txt)
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cat > notes.md <<NOTES
          ## Cài đặt / cập nhật trên Windows
          1. Tải \`pwv_${V}_x64-setup.exe\` bên dưới.
          2. Đóng app pwv đang mở, chạy bộ cài (cài đè lên bản cũ, không cần gỡ). Kho mật khẩu không bị ảnh hưởng.
          3. Windows cảnh báo SmartScreen (bộ cài chưa ký số) → **More info → Run anyway**. Chỉ làm vậy với file tải từ đúng trang này.

          ## Điện thoại Android
          Tải \`pwv_${V}_android-arm64.apk\` rồi mở để cài.
          ${SIGNER}

          ## Lưu ý khi nâng cấp từ 0.1.x
          Từ bản 0.2.0, file kho dùng định dạng mới mà bản cũ không đọc/ghi được. Hãy cập nhật **mọi thiết bị**:
          1. **Khoá hoặc đóng pwv trên tất cả các máy** trước khi cài bản mới ở máy đầu tiên (những gì thêm/sửa
             trên máy còn chạy bản cũ sau đó sẽ không lưu được).
          2. Cài bản mới lần lượt trên từng máy tính và điện thoại.
          3. Máy chưa cập nhật sẽ báo "hãy cập nhật phần mềm" thay vì mở file — dữ liệu không bị ảnh hưởng.
          4. Khi đã có một máy dùng bản mới, **đừng dùng bản 0.1.x ở bất kỳ máy nào nữa** (kể cả \`pwv.exe\` cũ): xem mục
             *Khi nâng cấp lên 0.2.0* trong README.

          ## Cứu hộ dữ liệu không cần app
          \`pwv_recover.py\` là công cụ Python độc lập (không dùng chung mã với app) để giải mã file kho hoặc một bản
          sao lưu ra JSON khi app không mở được kho. Cách dùng (cài Python, \`py -m pip install pynacl argon2-cffi\`,
          \`py pwv_recover.py …\`) nằm ở mục *Cứu hộ dữ liệu không cần app* trong README. Nên tải sẵn một bản
          và giữ nó (cùng file này) trên máy hoặc USB, phòng khi cần mà không vào được trang này.

          ## Kiểm tra file tải về
          \`SHA256SUMS.txt\` chỉ giúp phát hiện file tải bị LỖI (so bằng PowerShell:
          \`Get-FileHash .\\pwv_${V}_x64-setup.exe\`); nó nằm cùng chỗ với file cài nên không chứng minh được nguồn gốc.
          NOTES
          sed -i 's/^          //' notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$V" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "pwv $V" \
            --notes-file notes.md \
            --generate-notes
